<!DOCTYPE html>
<html>

<head>
    <title>Practice</title>
    <!-- <link rel="stylesheet" href="practice.css">  -->
    <style>
        .container {
            border: 2px solid black;
            display: grid;
            grid-template-columns: repeat(4, minmax(100px, 4fr));
            grid-template-areas:
                "nav nav"
                "side content"
                "footer footer";
        }

        .items {
            /* width:60px; */
            height: 40px;
            border: 2px solid black;
        }

        .item1 {
            grid-area: nav;
            color: red;
            background-color: black;
        }

        .item2 {
            color: red;
            grid-area: side;
        }

        .item3 {
            grid-area: content;
            color: red;
            background-color: darkblue;
            /* grid-row:2/3; */
            /* grid-column:2/4; */
        }

        .item4 {
            grid-area: content;
            color: red;
            background-color: blue;
            /* grid-row:3/4; */
        }

        .item5 {
            grid-area: side;
            color: red;
        }

        .item6 {
            grid-area: footer;
            color: red;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="items item1">1</div>
        <div class="items item2">2</div>
        <div class="items item3">3</div>
        <div class="items item4">4</div>
        <div class="items item5">5</div>
        <div class="items item6">6</div>
    </div>

</body>
</html>
